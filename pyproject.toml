[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ewp-waveform"
version = "0.0.0"
description = "Local-first deterministic waveform asset generator for podcast production."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Damian Szczech", email = "szczech.dam+ewpwaveform@gmail.com" }]
dependencies = [
  "pydantic==2.13.4",
  "typer==0.27.1",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ewp_waveform"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv]
package = true
