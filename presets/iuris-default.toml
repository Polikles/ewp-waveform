schema_version = 1
name = "iuris-default"
description = "Adopted scroll default (operator, *ad0c99b500c0.mov): 60 fps, 5 s window, envelope_oversample 4, motion sinc LOD, shutter 0, medium glow. Limited vs brand mirrored line."

[canvas]
width = 1400
height = 280
fps = 60

[waveform]
style = "mirrored"
domain = "time"
time_mode = "scroll"
window_seconds = 5.0
color = "#C7E6EC"
amplitude = 1.0
stroke_width = 6.0
center_line = true

[signal]
scale = "sqrt"
smoothing = 0.0
envelope_oversample = 4
envelope_aa = "area"
envelope_aa_support = 1.0
envelope_motion_lpf = "sinc"
envelope_motion_margin = 0.85
shutter_degrees = 0
shutter_mix = 0.25

[signal.normalization]
mode = "auto"
soft_clip = true

[effects.glow]
enabled = true
level = "medium"
color = "#C7E6EC"

[effects.particles]
enabled = false
motion = "float"
interaction = "none"
density = 0.20
intensity = 0.25

[palette]
steel_blue = "#3D5D73"
periwinkle_blue = "#6E7BA7"
slate_teal = "#2F474F"
pale_cyan = "#C7E6EC"
soft_yellow = "#F2C558"
