schema_version = 1
name = "iuris-moving-mouth"
description = "Moving mouth: preserved revision-4 activity carrier with bounded audio-derived deformation. Short-look accepted; full/NLE unqualified."

[canvas]
width = 1400
height = 280
fps = 60

[waveform]
style = "filled"
domain = "frequency"
color = "#C7E6EC"
amplitude = 0.82
stroke_width = 1.0
center_line = true

[signal]
fixed_axis_profile = "moving-mouth-v1"
detail_level = "balanced"
scale = "sqrt"
smoothing = 0.06

[signal.normalization]
mode = "auto"
soft_clip = true

[signal.frequency]
range = "auto"

[effects.glow]
enabled = true
level = "high"
color = "#C7E6EC"

[effects.particles]
enabled = false

[palette]
steel_blue = "#3D5D73"
periwinkle_blue = "#6E7BA7"
slate_teal = "#2F474F"
pale_cyan = "#C7E6EC"
soft_yellow = "#F2C558"
